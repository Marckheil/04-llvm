[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o4-llvm"
version = "0.1.0"
description = "o4-llvm: an LLM agent that tunes LLVM pass pipelines, measured against random search"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "numpy>=1.26",
  "psutil>=5.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["o4_llvm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
