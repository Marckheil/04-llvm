# 04llvm default configuration. Paths are relative to the repo root.

llvm:
  # Pinned upstream LLVM (Homebrew llvm@22). Never Apple's /usr/bin/clang.
  bin_dir: /opt/homebrew/opt/llvm@22/bin
  version: "22.1.8"

target:
  # Backend optimization level used for every candidate, so only the
  # middle-end pipeline differs between them.
  codegen_opt: "-O3"
  link_flags: ["-lm"]
  # Support code linked into every binary, compiled once and never tuned.
  # placement.c pins array placement (docs/decisions.md D7).
  runtime: [benchmarks/runtime/placement.c]

paths:
  polybench_src: benchmarks/src/polybench-c-4.2.1-beta
  build_dir: build
  results_dir: results

polybench:
  # "time" variant: kernel timer on, large inputs.
  time_dataset: LARGE_DATASET
  # "check" variant: array dump on, smaller inputs (used by the correctness gate).
  check_dataset: MEDIUM_DATASET
  # Too short to time reliably on the M2 (< 60 ms even at EXTRALARGE).
  # Excluded before any tuning; see docs/decisions.md D6.
  exclude: [atax, bicg, durbin, gemver, gesummv, jacobi-1d, mvt, trisolv]
  # Per-benchmark dataset override for the time variant, written by experiments/size_datasets.py
  dataset_overrides:
    deriche: EXTRALARGE_DATASET
    doitgen: EXTRALARGE_DATASET
    gemm: EXTRALARGE_DATASET
    syrk: EXTRALARGE_DATASET

timing:
  warmup: 2
  reps: 15
  min_runtime_s: 0.5
  # Upper bound used when picking dataset sizes (experiments/size_datasets.py).
  max_runtime_s: 10.0
  max_cv: 0.02
  bootstrap_samples: 10000

correctness:
  # Scaled tolerance for float arrays that are not bit-identical to clang -O0:
  # max|cand - ref| <= rtol * max|ref| per array. See docs/decisions.md D8.
  rtol: 1.0e-9

limits:
  compile_timeout_s: 120
  run_timeout_s: 300

episode:
  compile_budget: 30

search:
  # Random pipelines over configs/passes.yaml (docs/decisions.md D9).
  # scratch: the classic baseline. o3_suffix: default<O3> plus random passes,
  # which is the neighbourhood later methods search.
  modes:
    scratch: {prefix: "", min_len: 5, max_len: 40}
    o3_suffix: {prefix: "default<O3>", min_len: 1, max_len: 10}
  # One run per candidate for ranking; a run slower than slow_cap x the O3
  # median is killed (correct but useless, not worth waiting for).
  screen_reps: 1
  slow_cap: 2.0
  # The winner is re-timed against default<O3> interleaved...
  confirm_reps: 7
  # ...and, if it wins, again under each layout salt (D7): it must win under all.
  layout_salts: [0, 1, 2, 3]
  layout_reps: 3

seeds: [0, 1, 2]
